<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Запись на просмотр</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #1a1615;
      --card-bg: #26201e;
      --border-color: #3d3431;
      --accent-gold: #e2c08d;
      --text-main: #f5f2eb;
      --text-muted: #a89f91;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: var(--accent-gold); font-size: 20px; margin: 0 0 6px 0; }
    .header p { color: var(--text-muted); font-size: 13px; margin: 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--accent-gold); margin-bottom: 12px; text-transform: uppercase; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn-option { background: #332b28; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 8px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
    .btn-option.active { background: var(--accent-gold); color: var(--bg-color); border-color: var(--accent-gold); font-weight: 600; }
    .checkbox-item { display: flex; align-items: center; justify-content: space-between; background: #332b28; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 8px;}
    .checkbox-item input { width: 18px; height: 18px; accent-color: var(--accent-gold); }
    input[type="date"], input[type="time"] { width: 100%; background: #332b28; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 8px;}
    .submit-btn { width: 100%; background: var(--accent-gold); color: var(--bg-color); border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>✦ REALTY ESTATE ✦</h1>
    <p>Запись на просмотр квартиры</p>
  </div>

  <div class="card">
    <div class="section-title">1. Сколько комнат?</div>
    <div class="grid-4">
      <div class="btn-option" onclick="selectRooms(this, 'Студия')"> Студия</div>
      <div class="btn-option" onclick="selectRooms(this, '1-комнатная')"> 1-комнатная</div>
      <div class="btn-option" onclick="selectRooms(this, '2-комнатная')"> 2-комнатная</div>
      <div class="btn-option" onclick="selectRooms(this, '3+ комнатная')"> 3+ комнатная</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">2. Состав проживающих</div>
    <label class="checkbox-item">
      <span>Будут ли дети?</span>
      <input type="checkbox" id="hasChildren">
    </label>
    <label class="checkbox-item">
      <span>Будут ли животные?</span>
      <input type="checkbox" id="hasPets">
    </label>
  </div>

  <div class="card">
    <div class="section-title">3. Дата и время просмотра</div>
    <input type="date" id="viewDate">
    <input type="time" id="viewTime">
  </div>

  <button class="submit-btn" onclick="submitBooking()">ЗАПИСАТЬСЯ НА ОСМОТР</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 🔑 ВСТАВЬТЕ СВОИ ДАННЫЕ СЮДА:
    const BOT_TOKEN = 'https://milanovajina.github.io/raalty-app/'; 
    const ADMIN_CHAT_ID = '471387781'; 
    const SUPABASE_URL = 'https://milanovajina.github.io/raalty-app/';
    const SUPABASE_KEY = '8952525463:AAEY8_c9H0WXrf3KAv3_-QFtoVNhE2iV1bw';

    let selectedRooms = '';

    function selectRooms(element, rooms) {
      document.querySelectorAll('.grid-4 .btn-option').forEach


l => el.classList.remove('active');
      element.classList.add('active');
      selectedRooms = rooms;
    }

    async function submitBooking() 
      const hasChildren = document.getElementById('hasChildren').checked ? 'Да' : 'Нет';
      const hasPets = document.getElementById('hasPets').checked ? 'Да' : 'Нет';
      const date = document.getElementById('viewDate').value;
      const time = document.getElementById('viewTime').value;

      if (!selectedRooms) {
        alert('Выберите количество комнат!');
        return;
      }
      if (!date || !time) {
        alert('Выберите дату и время!');
        return;
      }

      const user = tg.initDataUnsafe?.user;
      const clientInfo = user ? `@${user.username || user.first_name}` : 'Гость Telegram';

      const bookingData = {
        rooms: selectedRooms,
        children: hasChildren,
        pets: hasPets,
        date: date,
        time: time,
        user_name: clientInfo
      };

      try {
        // 1. Сохранение в базу данных Supabase
        await fetch(`${SUPABASE_URL}/rest/v1/bookings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify(bookingData)
        });

        // 2. Отправка уведомления вам в Telegram
        const messageText = `✦ НОВАЯ ЗАЯВКА ✦\n\n👤 Клиент: ${clientInfo}\n🏢 Объект: ${selectedRooms}\n👶 Дети: ${hasChildren}\n🐾 Животные: ${hasPets}\n📅 Дата: ${date}\n⏰ Время: ${time}`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: ADMIN_CHAT_ID,
            text: messageText
          })
        });

        tg.showAlert('Заявка успешно отправлена! Риелтор свяжется с вами.');
        tg.close();
      } catch (error) {
        console.error(error);
        alert('Ошибка при отправке. Попробуйте еще раз.');
      }
    }
  </script>
</body>
</html>(e
